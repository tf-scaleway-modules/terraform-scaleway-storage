# OpenSpec project configuration for a Terraform module repository
# (template from the profiles repository, profile terraform-module).
# `context` is injected into every planning artifact; keep it to what is
# specific to THIS module. Engineering standards are not repeated here: they
# are fetched on demand from the referenced stores (quality, repository, terraform) (see the index that
# `openspec instructions` prints). `mise run spec-setup` registers the stores.
schema: spec-driven

# `ref` pins each store to a released tag (openspec-consumption); the setup
# script clones at that tag and reports a registered checkout on another commit.
references:
  - id: quality
    remote: https://gitlab.com/leminnov/agentic-coding/openspec/quality.git
    ref: v1.2.6
  - id: repository
    remote: https://gitlab.com/leminnov/agentic-coding/openspec/repository.git
    ref: v4.1.0
  - id: terraform
    remote: https://gitlab.com/leminnov/agentic-coding/openspec/terraform.git
    ref: v1.2.6

context: |
  Quality mandate: every artifact applies the non-negotiables of AGENTS.md
  (simple, efficient, secure, production-level) and cites the quality-store
  specs that decided something.

  Project: OpenTofu/Terraform module for Scaleway storage: S3-compatible
  Object Storage buckets (count expansion, versioning, object lock, default
  server-side encryption, lifecycle, CORS, ACL, static website, bucket
  policies, object uploads) and Block Storage volumes and snapshots (QCOW2
  export/import through Object Storage). Published on GitLab
  (leminnov/terraform/modules/scaleway-storage); consumers pin a git tag
  (?ref=vX.Y.Z). Apache-2.0.

  Stack: HCL only. required_version >= 1.11.0 (OpenTofu 1.11+). Provider
  pinned with ~> in versions.tf: scaleway/scaleway ~> 2.86. Every tool is
  pinned in mise.toml.

  Layout: main.tf is the header listing the themed files; object-storage.tf
  and block-storage.tf hold the resources, named `this` (plus `imported` for
  snapshots created from Object Storage); data.tf looks up the Scaleway
  project by name; locals.tf expands the count of buckets, volumes and
  snapshots into keys like "<key>-<n>" and builds the S3 endpoint;
  variables.tf is the whole input contract (map(object) inputs with
  optional() defaults and validation blocks); outputs.tf exposes IDs, names,
  endpoints and URLs (no secrets, no sensitive outputs). tests/ holds
  main.tftest.hcl and examples.tftest.hcl (mock_provider, no credentials, see
  TESTING.md); examples/minimal and examples/complete; SECURITY.md documents
  the security posture.

  Module-specific conventions (generic ones are standards in the referenced
  stores, fetched on demand): the caller configures the scaleway provider
  (credentials never enter the module); the project is resolved by name
  (project_name + organization_id); bucket, volume and snapshot maps are keyed
  by a logical key and expanded by `count` into "<key>-<n>" keys that
  dependent inputs (bucket_key, volume_key) and outputs use; README
  input/output tables are generated by terraform-docs between
  BEGIN_TF_DOCS/END_TF_DOCS; CHANGELOG.md is generated by git-cliff
  (.cliff.toml) from commit subjects, so each commit subject reads as its
  CHANGELOG line and the file is regenerated with `mise run changelog` at
  release, never edited by hand; semver applies to the module contract.

  Commands: tofu fmt -recursive; tofu init -backend=false && tofu validate;
  tflint --recursive; tofu test (unit tests in tests/, mock providers);
  pre-commit run -a (also regenerates the README via terraform-docs);
  mise run changelog; mise run spec-validate (openspec validate --all
  --strict).

  Standards: fetch the referenced-store specs listed in these instructions
  whose id matches the area touched, and cite the ones applied.

rules:
  proposal:
    - Classify the change as semver major/minor/patch per terraform-versioning and list every input or output whose type, default or meaning changes
    - State what lands in state; a new secret-bearing input must follow terraform-security (write-only argument plus *_wo_version) or justify why it cannot
  specs:
    - Reuse the existing capability directories under openspec/specs (module-contract, buckets, bucket-access-and-lock, objects, block-volumes, block-snapshots); add a new one only for a new module area
    - Write requirements against the module's observable contract (input shape, validation errors, resources produced, outputs, check warnings, empty second plan), not against provider internals
    - Give every validation block and every check block a scenario with the rejected or warned input
  design:
    - Name the resources and arguments used and the provider version that introduced them
    - Explain how the change avoids a perpetual diff and how existing state migrates (moved blocks, in-place update or forced replacement)
    - Keep provider {} and backend {} out of the module and never shell out to a CLI
  tasks:
    - Include unit tests in tests/main.tftest.hcl (a rejected-input run for every new validation), and examples/complete plus any example the change affects
    - Include tofu fmt -recursive, tofu validate, tflint --recursive, tofu test and pre-commit run -a (terraform-docs README regeneration)
    - Include a commit subject that reads as its CHANGELOG line (git-cliff generates CHANGELOG.md; do not edit it by hand) with upgrade notes in the commit body for anything breaking, and README / SECURITY.md updates when the compatibility matrix or the what-lands-in-state table changes

operations:
  apply:
    guidance:
      - Apply the quality store (simplicity, efficiency, security, production-readiness) to every task; fetch terraform-code-style, terraform-variables and terraform-outputs from the terraform store before editing HCL; flag any deviation with a DEVIATION(<spec-id>) comment
      - Run tofu fmt -recursive, tofu validate and tofu test after each task group and do not mark a task done while they fail
      - Do not apply the examples against a real Scaleway account unless the user asked; say explicitly when it was skipped
      - Report test and scanner output as-is, including failures
  archive:
    guidance:
      - Confirm the commit subjects read as CHANGELOG lines (regenerate CHANGELOG.md with `mise run changelog` at release) and the terraform-docs README block was updated before archiving
      - Summarize which main specs changed and any requirement that was removed
